name: Build OpenBeken RTL8720CF

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Environment & Build RTL87X0C
        run: |
          cd platforms/RTL87X0C/GCC-RELEASE
          make
        
      - name: Upload RTL8720CF Binary
        uses: actions/upload-artifact@v4
        with:
          name: OpenRTL87X0C-firmware
          path: platforms/RTL87X0C/GCC-RELEASE/**/*.bin
